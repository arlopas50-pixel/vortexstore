<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VortexStore</title>

<style>

#nicknameBox{

margin-top:10px;
padding:10px;
background:#111827;
border-radius:10px;
color:#00ff99;
font-size:14px;

}

.result-box{
display:none;
margin-top:15px;
padding:15px;
border-radius:14px;
text-align:center;
font-weight:bold;
}

.success{
background:#064e3b;
color:#6ee7b7;
}

.failed{
background:#7f1d1d;
color:#fca5a5;
}

.loading{
display:none;
margin-top:15px;
background:#111827;
padding:14px;
border-radius:14px;
text-align:center;
color:#60a5fa;
font-weight:bold;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top right,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom left,#0f766e 0%,transparent 30%),
#020617;
color:white;
padding:25px;
min-height:100vh;
}

/* HEADER */

.header{
margin-bottom:35px;
}

.logo{
font-size:55px;
margin-bottom:10px;
}

.title{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:17px;
color:#cbd5e1;
}

/* SEARCH */

.search-box{
margin-top:25px;
}

.search-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:18px;
background:#0f172a;
color:white;
font-size:16px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
margin-top:35px;
}

/* CARD */

.card{
background:rgba(15,23,42,0.85);
border:1px solid rgba(255,255,255,0.05);
padding:22px;
border-radius:24px;
backdrop-filter:blur(10px);
transition:0.3s;
box-shadow:
0 0 15px rgba(59,130,246,0.08);
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 0 20px rgba(59,130,246,0.2);
}

.card h2{
font-size:22px;
margin-bottom:12px;
}

.price{
font-size:20px;
font-weight:bold;
color:#60a5fa;
margin-bottom:18px;
}

.buy-btn{
width:100%;
padding:14px;
border:none;
border-radius:16px;
background:linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.buy-btn:hover{
opacity:0.9;
}

/* FOOTER */

.footer{
margin-top:45px;
text-align:center;
color:#94a3b8;
font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

.products{
grid-template-columns:1fr;
}

.title{
font-size:34px;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.popup-box{
background:#0f172a;
width:100%;
max-width:420px;
padding:30px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.05);
box-shadow:
0 0 30px rgba(59,130,246,0.2);
}

.popup-box input::placeholder{
color:#94a3b8;
}

.popup-box h2{
font-size:28px;
margin-bottom:10px;
}

.product-price{
font-size:22px;
font-weight:bold;
color:#60a5fa;
margin-bottom:25px;
}

.popup-box input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:14px;
background:#1e293b;
color:white;
font-size:16px;
margin-bottom:15px;
}

.nickname{
background:#111827;
padding:14px;
border-radius:14px;
margin-bottom:20px;
color:#cbd5e1;
}

.popup-box button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.close-btn{
background:#ef4444 !important;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">⚡</div>

<div class="title">
VortexStore
</div>

<div class="subtitle">
Auto Topup Mobile Legends Murah & Cepat
</div>

<div class="search-box">
<input type="text"
id="searchInput"
placeholder="Cari produk..."
onkeyup="searchProducts()">
</div>

<!-- PRODUCTS -->

<div class="products" id="productList"></div>

<!-- FOOTER -->

<div class="footer">
© 2025 VortexStore — Powered By VIP Reseller
</div>
  
<!-- SCRIPT -->

<div class="popup" id="popup">

<div class="popup-box">

<h2 id="productName">
Mobile Legends
</h2>

<div class="product-price" id="productPrice">
Rp 0
</div>

<input
type="text"
id="userId"
placeholder="Masukkan User ID"
onkeyup="checkNickname()">

<input
type="text"
id="serverId"
placeholder="Masukkan Server ID"
onkeyup="checkNickname()">

<div id="nicknameBox">
Nickname: -
</div>

<div class="loading" id="loading">
Memproses transaksi...
</div>

<div class="result-box" id="resultBox">
Status transaksi
</div>

<button onclick="submitOrder()">
Checkout
</button>

<button class="close-btn"
onclick="closePopup()">
Tutup
</button>

</div>

</div>
  
<script>

async function checkNickname(){

const userId =
document.getElementById("userId").value

const serverId =
document.getElementById("serverId").value

if(userId.length < 5) return

try{

const response =
await fetch('/nickname',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
userId,
serverId
})

})

const data = await response.json()

document.getElementById(
'nicknameBox'
).innerHTML =
'Nickname: ' + data.nickname

}catch(err){

document.getElementById(
'nicknameBox'
).innerHTML =
'Nickname tidak ditemukan'

}

}


const products = [

{
  code: "MLA3-S13",
  name: "3 Diamonds",
  price: "Rp 1.030"
},

{
  code: "MLA5-S13",
  name: "5 Diamonds",
  price: "Rp 1.452"
},

{
  code: "MLA10-S13",
  name: "10 Diamonds",
  price: "Rp 2.904"
},

{
  code: "MLA12-S13",
  name: "12 Diamonds",
  price: "Rp 3.387"
},

{
  code: "MLA15-S13",
  name: "15 Diamonds",
  price: "Rp 4.353"
},

{
  code: "MLA17-S13",
  name: "17 Diamonds",
  price: "Rp 4.578"
},

{
  code: "MLA19-S13",
  name: "19 Diamonds",
  price: "Rp 5.314"
},

{
  code: "MLA22-S13",
  name: "22 Diamonds",
  price: "Rp 6.296"
},

{
  code: "MLA28-S13",
  name: "28 Diamonds",
  price: "Rp 7.724"
},

{
  code: "MLA36-S13",
  name: "36 Diamonds",
  price: "Rp 9.690"
},

{
  code: "MLA44-S13",
  name: "44 Diamonds",
  price: "Rp 11.552"
},

{
  code: "MLA59-S13",
  name: "59 Diamonds",
  price: "Rp 15.449"
},

{
  code: "MLA85-S13",
  name: "85 Diamonds",
  price: "Rp 22.198"
},

{
  code: "MLAWDP1X-S13",
  name: "Weekly Diamond Pass",
  price: "Rp 27.967"
},

{
  code: "MLA113-S13",
  name: "113 Diamonds",
  price: "Rp 29.823"
},

{
  code: "MLA170-S13",
  name: "170 Diamonds",
  price: "Rp 44.229"
},

{
  code: "MLA240-S13",
  name: "240 Diamonds",
  price: "Rp 62.330"
},

{
  code: "MLA568-S13",
  name: "568 Diamonds",
  price: "Rp 144.696"
},

{
  code: "MLA716-S13",
  name: "716 Diamonds",
  price: "Rp 182.766"
},

{
  code: "MLA1000-S13",
  name: "1000 Diamonds",
  price: "Rp 248.436"
}

]

const productContainer = document.querySelector(".products")

products.forEach(product => {

productContainer.innerHTML += `

<div class="card">

<h2>${product.name}</h2>

<div class="price">
${product.price}
</div>

<button
class="buy-btn"
onclick="orderNow(
'${product.code}',
'${product.name}',
'${product.price}'
)">
Buy Now
</button>

</div>

`

})


function searchProducts() {

const input = document
.getElementById("searchInput")
.value.toLowerCase()

const cards =
document.querySelectorAll(".card")

cards.forEach(card => {

const text =
card.innerText.toLowerCase()

if(text.includes(input)) {

card.style.display = "block"

} else {

card.style.display = "none"

}

})

}


let selectedService = ''
let selectedPrice = ''
let selectedProduct = ''

function orderNow(service,product,price){

selectedService = service
selectedProduct = product
selectedPrice = price

document.getElementById('popup')
.style.display = 'flex'

document.getElementById('productName')
.innerText = product

document.getElementById('productPrice')
.innerText = price

}

function closePopup(){

document.getElementById('popup')
.style.display = 'none'

}

async function submitOrder(){

const userId =
document.getElementById('userId').value

const serverId =
document.getElementById('serverId').value

if(!userId || !serverId){

alert('Lengkapi data')

return

}

document.getElementById('nickname')
.innerText = 'Nickname: Player ML'

document.getElementById('loading')
.style.display = 'block'

try{

const response = await fetch('/order',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

userId:userId,
serverId:serverId,
service:selectedService

})

})

const result = await response.json()

document.getElementById('loading')
.style.display = 'none'

alert(JSON.stringify(result))

const resultBox =
document.getElementById('resultBox')

resultBox.style.display = 'block'

if(
result.result == true ||
result.success == true
){

resultBox.className =
'result-box success'

resultBox.innerText =
'✅ Transaksi Berhasil'

}else{

resultBox.className =
'result-box failed'

resultBox.innerText =
'❌ ' + (
result.message ||
'Transaksi Gagal'
)

}

}catch(err){

document.getElementById('loading')
.style.display = 'none'

alert('Server Error')

}

}

</script>
</body>
</html>
