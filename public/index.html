<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexStore</title>

<style>
body{
background:#070b1a;
color:white;
font-family:sans-serif;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:20px;
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-weight:bold;
}
</style>

</head>

<body>

<h1>⚡ VortexStore</h1>
<p>Auto Topup VIP Reseller</p>

<div class="card">

<h2>Mobile Legends</h2>

<p>86 Diamond - Rp10.000</p>

<button onclick="orderNow()">
Buy Now
</button>

</div>

<script>

function orderNow(){

const userId = prompt('Masukkan User ID')

if(!userId){
return
}

const confirmBuy = confirm(
'Beli 86 Diamond untuk ID ' + userId + '?'
)

if(confirmBuy){

alert('Pesanan berhasil dikirim')

}

}
</script>

</body>
</html>
