<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VortexStore</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top right,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom left,#0f766e 0%,transparent 30%),
#020617;
color:white;
padding:25px;
min-height:100vh;
}

/* HEADER */

.header{
margin-bottom:35px;
}

.logo{
font-size:55px;
margin-bottom:10px;
}

.title{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:17px;
color:#cbd5e1;
}

/* SEARCH */

.search-box{
margin-top:25px;
}

.search-box input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:18px;
background:#0f172a;
color:white;
font-size:16px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
margin-top:35px;
}

/* CARD */

.card{
background:rgba(15,23,42,0.85);
border:1px solid rgba(255,255,255,0.05);
padding:22px;
border-radius:24px;
backdrop-filter:blur(10px);
transition:0.3s;
box-shadow:
0 0 15px rgba(59,130,246,0.08);
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 0 20px rgba(59,130,246,0.2);
}

.card h2{
font-size:22px;
margin-bottom:12px;
}

.price{
font-size:20px;
font-weight:bold;
color:#60a5fa;
margin-bottom:18px;
}

.buy-btn{
width:100%;
padding:14px;
border:none;
border-radius:16px;
background:linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.buy-btn:hover{
opacity:0.9;
}

/* FOOTER */

.footer{
margin-top:45px;
text-align:center;
color:#94a3b8;
font-size:14px;
}

/* MOBILE */

@media(max-width:700px){

.products{
grid-template-columns:1fr;
}

.title{
font-size:34px;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.popup-box{
background:#0f172a;
padding:30px;
border-radius:20px;
width:90%;
max-width:400px;
}

.popup-box h2{
margin-bottom:20px;
}

.popup-box input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
font-size:16px;
}

.popup-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-weight:bold;
margin-top:10px;
}

.close-btn{
background:#ef4444 !important;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">⚡</div>

<div class="title">
VortexStore
</div>

<div class="subtitle">
Auto Topup Mobile Legends Murah & Cepat
</div>

<div class="search-box">
<input type="text" placeholder="Cari produk...">
</div>

</div>

<!-- PRODUCTS -->

<div class="products">

<div class="card">
<h2>55 Diamonds</h2>
<div class="price">Rp 13.414</div>

<button class="buy-btn"
onclick="orderNow('ML55')">
Buy Now
</button>
</div>

<div class="card">
<h2>86 Diamonds</h2>
<div class="price">Rp 21.153</div>

<button class="buy-btn"
onclick="orderNow('ML86')">
Buy Now
</button>
</div>

<div class="card">
<h2>172 Diamonds</h2>
<div class="price">Rp 41.960</div>

<button class="buy-btn"
onclick="orderNow('ML172')">
Buy Now
</button>
</div>

<div class="card">
<h2>257 Diamonds</h2>
<div class="price">Rp 60.772</div>

<button class="buy-btn"
onclick="orderNow('ML257')">
Buy Now
</button>
</div>

<div class="card">
<h2>565 Diamonds</h2>
<div class="price">Rp 132.413</div>

<button class="buy-btn"
onclick="orderNow('ML565')">
Buy Now
</button>
</div>

<div class="card">
<h2>706 Diamonds</h2>
<div class="price">Rp 165.085</div>

<button class="buy-btn"
onclick="orderNow('ML706')">
Buy Now
</button>
</div>

</div>

<!-- FOOTER -->

<div class="footer">
© 2025 VortexStore — Powered By VIP Reseller
</div>

<div class="popup" id="popup">

<div class="popup-box">

<h2>Checkout Mobile Legends</h2>

<input type="text"
id="userId"
placeholder="Masukkan User ID">

<input type="text"
id="serverId"
placeholder="Masukkan Server ID">

<button onclick="submitOrder()">
Lanjutkan
</button>

<button class="close-btn"
onclick="closePopup()">
Tutup
</button>

</div>

</div>
  
<!-- SCRIPT -->

<script>

let selectedService = ''

function orderNow(service){

selectedService = service

document.getElementById('popup')
.style.display = 'flex'

}

function closePopup(){

document.getElementById('popup')
.style.display = 'none'

}

async function submitOrder(){

const userId =
document.getElementById('userId').value

const serverId =
document.getElementById('serverId').value

if(!userId || !serverId){

alert('Lengkapi data')

return

}

try{

alert('Checking Nickname...')

const nick = 'Player ML'

alert('Nickname: ' + nick)

alert('Mengirim transaksi...')

const response = await fetch('/order',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

userId:userId,
serverId:serverId,
service:selectedService

})

})

const result = await response.json()

console.log(result)

alert(JSON.stringify(result))

closePopup()

}catch(err){

alert('Server Error')

}

}

</script>
</body>
</html>
