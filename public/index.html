<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VortexStore</title>

<style>

.hero-banner{

position:relative;
height:180px;

border-radius:20px;

overflow:hidden;

margin-bottom:25px;

background:
linear-gradient(
135deg,
#0f172a,
#1e3a8a,
#2563eb
);

display:flex;
align-items:center;
justify-content:center;

box-shadow:
0 0 25px rgba(37,99,235,0.5);

}

.slide{

position:absolute;

font-size:28px;
font-weight:bold;

color:white;

opacity:0;

transition:1s;

text-align:center;
padding:20px;

}

.slide.active{

opacity:1;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow-x:hidden;
min-height:100vh;
display:flex;
flex-direction:column;
}

.products{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(150px,1fr));

gap:15px;

min-height:700px;

align-content:start;
}

.card{
width:100%;
overflow:hidden;
}

.popup-box{
width:90%;
max-width:400px;
margin:auto;
}

.popup-box input{
width:100%;
max-width:100%;
}

.popup-box button{
width:100%;
max-width:100%;
}

.footer{
margin-top:auto;
}

.game-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:20px;

margin-top:30px;

}

.game-card{

position:relative;

height:180px;

border-radius:20px;

overflow:hidden;

background:#111827;

cursor:pointer;

}

.game-card:hover{

transform:scale(1.03);

}

.game-card img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}

.game-name{

position:absolute;
bottom:0;
left:0;
right:0;

padding:10px;

background:
linear-gradient(
transparent,
rgba(0,0,0,0.9)
);

color:white;
font-weight:bold;
font-size:15px;

}

.game-menu{

display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;

}

.game-menu button{

padding:12px 18px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
cursor:pointer;
font-weight:bold;
transition:0.3s;

}

.game-menu button:hover{

background:#2563eb;

}

#nicknameBox{

margin-top:10px;
padding:10px;
background:#111827;
border-radius:10px;
color:#00ff99;
font-size:14px;

}

.result-box{
display:none;
margin-top:15px;
padding:15px;
border-radius:14px;
text-align:center;
font-weight:bold;
}

.success{
background:#064e3b;
color:#6ee7b7;
}

.failed{
background:#7f1d1d;
color:#fca5a5;
}

.loading{
display:none;
margin-top:15px;
background:#111827;
padding:14px;
border-radius:14px;
text-align:center;
color:#60a5fa;
font-weight:bold;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top right,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom left,#0f766e 0%,transparent 30%),
#020617;
color:white;
padding:25px;
min-height:100vh;
overflow-x:hidden;
}

/* HEADER */

.header{
margin-bottom:35px;
}

.logo{
font-size:55px;
margin-bottom:10px;
}

.title{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:17px;
color:#cbd5e1;
}

/* SEARCH */

.search-box{
margin-top:26px;
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:17px;
border:none;
outline:none;
border-radius:18px;
background:#0f172a;
color:white;
font-size:16px;
}

/* PRODUCTS */

.products{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;

min-height:700px;

align-content:start;

}

/* CARD */

.card{
background:rgba(15,23,42,0.85);
border:1px solid rgba(255,255,255,0.05);
padding:22px;
border-radius:24px;
backdrop-filter:blur(10px);
transition:0.3s;
box-shadow:
0 0 15px rgba(59,130,246,0.08);
width:100%;
box-sizing:border-box;

}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 0 20px rgba(59,130,246,0.2);
}

.card h2{
font-size:22px;
margin-bottom:12px;
}

.price{
font-size:20px;
font-weight:bold;
color:#60a5fa;
margin-bottom:18px;
}

.buy-btn{
width:100%;
padding:14px;
border:none;
border-radius:16px;
background:linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.buy-btn:hover{
opacity:0.9;
}

/* MOBILE */

@media(max-width:700px){

.products{
grid-template-columns:1fr;
}

.title{
font-size:34px;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.popup-box{
background:#0f172a;
width:100%;
max-width:420px;
padding:30px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.05);
box-shadow:
0 0 30px rgba(59,130,246,0.2);
}

.popup-box input::placeholder{
color:#94a3b8;
}

.popup-box h2{
font-size:28px;
margin-bottom:10px;
}

.product-price{
font-size:22px;
font-weight:bold;
color:#60a5fa;
margin-bottom:25px;
}

.popup-box input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:14px;
background:#1e293b;
color:white;
font-size:16px;
margin-bottom:15px;
}

.nickname{
background:#111827;
padding:14px;
border-radius:14px;
margin-bottom:20px;
color:#cbd5e1;
}

.popup-box button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(to right,#3b82f6,#8b5cf6);
color:white;
font-size:16px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.close-btn{
background:#ef4444 !important;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="logo">⚡</div>

<div class="title">
VortexStore
</div>

<div class="subtitle">
Auto Topup All Games Murah & Cepat
</div>

<div class="search-box">
<input type="text"
id="searchInput"
placeholder="Cari produk..."
onkeyup="searchProducts()">
</div>

<!-- PRODUCTS -->

<div class="hero-banner">

<div class="slide active">
FAST TOPUP PROCESS ⚡
</div>

<div class="slide">
CHEAP & TRUSTED STORE 🔥
</div>

<div class="slide">
OPEN 24 HOURS 🚀
</div>

</div>

<div class="game-grid">

<div class="game-card"
onclick="window.location.href='Mobile_Legends.html'"

<img src="https://cdn.oneesports.id/cdn-data/sites/2/2022/06/Mobile-Legends.jpg">

<div class="game-name">
Mobile Legends
</div>

</div>

<div class="game-card"
onclick="window.location.href='Free_Fire.html'"

<img src="https://wallpaperaccess.com/full/3214373.jpg">

<div class="game-name">
Free Fire
</div>

</div>

<div class="game-card"
onclick="loadGame('pubg')">

<img src="https://images8.alphacoders.com/862/862638.jpg">
<div class="game-name">
PUBG Mobile
</div>

</div>

</div>

<div class="products" id="products"></div>

<!-- SCRIPT -->

<div class="popup" id="popup">

<div class="popup-box">

<h2 id="productName">
Mobile Legends
</h2>

<div class="product-price" id="productPrice">
Rp 0
</div>

<div id="serverBox">

<input
type="text"
id="UserId"
placeholder="Masukkan User ID"
onkeyup="checkNickname()">

</div>

<div id="serverBox">

<input
type="text"
id="serverId"
placeholder="Masukkan Server ID"
onkeyup="checkNickname()">

</div>

<div id="nicknameBox">
Nickname: -
</div>

<div class="loading" id="loading">
Memproses transaksi...
</div>

<div class="result-box" id="resultBox">
Status transaksi
</div>

<button onclick="submitOrder()">
Checkout
</button>

<button class="close-btn"
onclick="closePopup()">
Tutup
</button>

</div>

</div>
  
<script>

async function checkNickname(){

const userId =
document.getElementById("userId").value

const serverId =
document.getElementById("serverId").value

if(userId.length < 5) return

try{

const response =
await fetch('/nickname',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
userId,
serverId
})

})

const data = await response.json()

document.getElementById(
'nicknameBox'
).innerHTML =
'Nickname: ' + data.nickname

}catch(err){

document.getElementById(
'nicknameBox'
).innerHTML =
'Nickname tidak ditemukan'

}

}


let currentGame = ''
const games = {

ml:[

{
service:"MLA3-S13",
name:"3 Diamonds",
price:"Rp 1.030"
},

{
service:"MLA5-S13",
name:"5 Diamonds",
price:"Rp 1.452"
},

{
service:"MLA10-S13",
name:"10 Diamonds",
price:"Rp 2.904"
}

],

ff:[

{
service:"FF5",
name:"5 Diamonds FF",
price:"Rp 1.000"
},

{
service:"FF12",
name:"12 Diamonds FF",
price:"Rp 2.000"
}

],

pubg:[

{
service:"PUBG60",
name:"60 UC",
price:"Rp 15.000"
}

]

}

const productContainer = document.querySelector(".products")

function loadGame(game){

currentGame = game

const productContainer =
document.getElementById("products")

productContainer.innerHTML = ""

games[game].forEach(product=>{

productContainer.innerHTML += `

<div class="card">

<h2>${product.name}</h2>

<div class="price">
${product.price}
</div>

<button class="buy-btn"
onclick="orderNow(
'${product.service}',
'${product.name}',
'${product.price}'
)">
Buy Now
</button>

</div>

`

})

}


function searchProducts() {

const input = document
.getElementById("searchInput")
.value.toLowerCase()

const cards =
document.querySelectorAll(".card")

cards.forEach(card => {

const text =
card.innerText.toLowerCase()

if(text.includes(input)) {

card.style.display = "block"

} else {

card.style.display = "none"

}

})

}


let selectedService = ''
let selectedPrice = ''
let selectedProduct = ''

function orderNow(service,product,price){

selectedService = service
selectedProduct = product
selectedPrice = price

document.getElementById('popup')
.style.display = 'flex'

const serverBox =
document.getElementById('serverBox')

if(currentGame === 'ml'){

serverBox.style.display = 'block'

}else{

serverBox.style.display = 'none'

}

document.getElementById('productName')
.innerText = product

document.getElementById('productPrice')
.innerText = price

}

function closePopup(){

document.getElementById('popup')
.style.display = 'none'

}

async function submitOrder(){

const userId =
document.getElementById('userId').value

const serverId =
document.getElementById('serverId').value

if(!userId || !serverId){

alert('Lengkapi data')

return

}

document.getElementById('nickname')
.innerText = 'Nickname: Player ML'

document.getElementById('loading')
.style.display = 'block'

try{

const response = await fetch('/order',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({

userId:userId,
serverId:serverId,
service:selectedService

})

})

const result = await response.json()

document.getElementById('loading')
.style.display = 'none'

alert(JSON.stringify(result))

const resultBox =
document.getElementById('resultBox')

resultBox.style.display = 'block'

if(
result.result == true ||
result.success == true
){

resultBox.className =
'result-box success'

resultBox.innerText =
'✅ Transaksi Berhasil'

}else{

resultBox.className =
'result-box failed'

resultBox.innerText =
'❌ ' + (
result.message ||
'Transaksi Gagal'
)

}

}catch(err){

document.getElementById('loading')
.style.display = 'none'

alert('Server Error')

}

}

const slides =
document.querySelectorAll('.slide')

let currentSlide = 0

setInterval(()=>{

slides[currentSlide]
.classList.remove('active')

currentSlide++

if(currentSlide >= slides.length){

currentSlide = 0

}

slides[currentSlide]
.classList.add('active')

},3000)

</script>
</body>
</html>
