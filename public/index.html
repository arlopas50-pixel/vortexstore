<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexStore</title>

<style>
body{
background:#070b1a;
color:white;
font-family:sans-serif;
padding:20px;
}
.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}
.card{
background:#111827;
padding:20px;
border-radius:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-weight:bold;
}
  .products{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
  }
</style>

</head>

<body>

<h1>⚡ VortexStore</h1>
<p>Auto Topup Termurah Terlengkap Dan tercepat</p>

<div class="products">

<div class="card">
<h2>55 Diamonds</h2>
<p>Rp 13.414</p>
<button onclick="orderNow()">Buy Now</button>
</div>

<div class="card">
<h2>86 Diamonds</h2>
<p>Rp 21.153</p>
<button onclick="orderNow()">Buy Now</button>
</div>

<div class="card">
<h2>172 Diamonds</h2>
<p>Rp 41.960</p>
<button onclick="orderNow()">Buy Now</button>
</div>

<div class="card">
<h2>257 Diamonds</h2>
<p>Rp 60.772</p>
<button onclick="orderNow()">Buy Now</button>
</div>

<div class="card">
<h2>565 Diamonds</h2>
<p>Rp 132.413</p>
<button onclick="orderNow()">Buy Now</button>
</div>

<div class="card">
<h2>706 Diamonds</h2>
<p>Rp 165.085</p>
<button onclick="orderNow()">Buy Now</button>
</div>

</div>
<script>

function orderNow(){

const userId = prompt('Masukkan User ID')

if(!userId){
return
}

const serverId = prompt('Masukkan Server ID')

if(!serverId){
return
}

const confirmBuy = confirm(
'Beli diamond untuk ID ' 
+ userId + 
' (' + serverId + ')?'
)

if(confirmBuy){

alert(
'Pesanan berhasil dikirim\n\nID: '
+ userId +
'\nServer: ' +
serverId
)

}

}

</script>
  
</body>
</html>
